[project]
name = "pads-mcp"
version = "0.2.1"
description = "MCP server for controlling PADS Logic / PADS Layout 9.x (schematic drawing, part placement, wiring) via COM"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "mcp>=1.9.0,<2",
    "pywin32>=306",
    "pillow>=10.0",
]

[project.scripts]
pads-mcp = "pads_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pads_mcp"]

[tool.uv]
# rebuild cached `uvx --from <path>` installs whenever the sources change, not only pyproject.toml
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }]
